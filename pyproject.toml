[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elr"
version = "0.1.0"
description = "ELR - Educational Learning Repository"
requires-python = ">=3.12"
dependencies = [
"SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
"pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
